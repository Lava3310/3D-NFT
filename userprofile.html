<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D NFT · профиль</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>
    <div class="profile-container">
        <div class="profile-content">
            <!-- Баланс -->
            <div class="balance-section">
                <div class="balance-top">
                    <div class="balance-left">
                        <button class="back-btn" id="backBtn">←</button>
                        <div class="balance-info">
                            <div class="balance-label">Баланс</div>
                            <div class="balance-row">
                                <span class="balance-amount" id="balance">125</span>
                                <span class="balance-currency">TON</span>
                            </div>
                        </div>
                    </div>
                    <button class="settings-icon" id="settingsBtn">⚙️</button>
                </div>
                
                <div class="estimated-block">
                    <span class="estimated-icon">💰</span>
                    <span class="estimated-text">Оценка имущества</span>
                    <span class="estimated-value" id="estimatedValue">1 250 TON</span>
                </div>

                <div class="action-buttons">
                    <button class="action-btn" id="depositBtn">
                        <span class="action-icon">+</span>
                        <span class="action-text">Пополнить</span>
                    </button>
                    <button class="action-btn" id="withdrawBtn">
                        <span class="action-icon">↑</span>
                        <span class="action-text">Вывести</span>
                    </button>
                </div>
            </div>

            <!-- Профиль -->
            <div class="user-card">
                <div class="avatar">👤</div>
                <div class="user-info">
                    <div class="user-name" id="userName">CryptoBuilder</div>
                    <div class="wallet-address" id="walletDisplay">Кошелёк не подключён</div>
                </div>
                <button class="edit-btn" id="editProfileBtn">✎</button>
            </div>

            <!-- Подключение кошелька -->
            <div class="connect-wallet-panel" id="connectPanel">
                <div class="connect-title">Подключить TON кошелёк</div>
                <input type="text" class="wallet-input" id="walletInput" placeholder="Введите адрес кошелька">
                <button class="connect-submit" id="connectSubmit">Подключить</button>
            </div>

            <!-- История -->
            <div class="history-section">
                <div class="history-title">История действий</div>
                <div class="history-list" id="historyList">
                    <!-- элементы истории -->
                </div>
            </div>
        </div>
    </div>

    <!-- Модалка -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-sheet">
            <h2>Настройки</h2>
            <div class="modal-item">
                <span>Тема</span>
                <button class="modal-btn" id="themeToggle">
                    <span id="themeText">🌙 Тёмная</span>
                </button>
            </div>
            <div class="modal-item">
                <span>Уведомления</span>
                <button class="notif-btn" id="notifToggle">Вкл</button>
            </div>
            <div class="modal-item">
                <span>Условия</span>
                <button class="modal-btn" id="termsBtn">Читать</button>
            </div>
            <button class="close-modal" id="closeSettings">Закрыть</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/profile.js"></script>
</body>
</html>
