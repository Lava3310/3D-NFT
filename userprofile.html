<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D NFT · профиль</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg-start: #0a1424;
            --bg-end: #1a2a3a;
            --surface-color: rgba(20, 35, 55, 0.7);
            --card-color: rgba(25, 45, 65, 0.6);
            --text-primary: #ffffff;
            --text-secondary: #a0b8d0;
            --accent-color: #3a7bd5;
            --accent-glow: rgba(58, 123, 213, 0.3);
            --border-color: rgba(80, 140, 255, 0.2);
            --shadow: 0 8px 32px rgba(0, 20, 40, 0.3);
            --blur: blur(20px);
        }

        body.light-theme {
            --bg-start: #e0ecff;
            --bg-end: #d0e0ff;
            --surface-color: rgba(255, 255, 255, 0.7);
            --card-color: rgba(255, 255, 255, 0.6);
            --text-primary: #0a1a2a;
            --text-secondary: #406898;
            --accent-color: #2a7aff;
            --accent-glow: rgba(42, 122, 255, 0.2);
            --border-color: rgba(42, 122, 255, 0.15);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }

        body {
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            background-size: cover;
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 20px;
        }

        .profile-container {
            width: 100%;
            max-width: 500px;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .profile-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-top: 10px;
        }

        /* Баланс с кнопками */
        .balance-section {
            background: var(--card-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 18px 22px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            width: 100%;
            flex-shrink: 0;
        }

        /* Верхний ряд с балансом слева */
        .balance-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .balance-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 30px;
            background: var(--surface-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-btn:active {
            transform: scale(0.92);
            background: var(--accent-color);
        }

        .balance-info {
            display: flex;
            flex-direction: column;
        }

        .balance-label {
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
            font-weight: 500;
        }

        .balance-row {
            display: flex;
            align-items: baseline;
        }

        .balance-amount {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -1px;
        }

        .balance-currency {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin-left: 4px;
            letter-spacing: -1px;
        }

        .settings-icon {
            width: 40px;
            height: 40px;
            border-radius: 30px;
            background: var(--surface-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-icon:active {
            transform: rotate(30deg) scale(0.92);
            background: var(--accent-color);
        }

        /* Оценочная стоимость */
        .estimated-block {
            background: var(--surface-color);
            border-radius: 24px;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--border-color);
        }

        .estimated-icon {
            font-size: 20px;
        }

        .estimated-text {
            font-size: 14px;
            color: var(--text-secondary);
            flex: 1;
        }

        .estimated-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-color);
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .action-btn {
            flex: 1;
            background: var(--surface-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 36px;
            padding: 8px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: var(--shadow);
            color: var(--text-primary);
        }

        .action-btn:active {
            transform: scale(0.96);
            background: var(--accent-color);
        }

        .action-icon {
            width: 26px;
            height: 26px;
            border-radius: 26px;
            background: transparent;
            border: 2px solid var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .action-text {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* Профиль пользователя */
        .user-card {
            background: var(--card-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 36px;
            padding: 18px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 30px;
            background: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .wallet-address {
            font-size: 11px;
            color: var(--text-secondary);
            background: var(--surface-color);
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid var(--border-color);
        }

        .edit-btn {
            width: 40px;
            height: 40px;
            border-radius: 30px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .edit-btn:active {
            background: var(--accent-color);
            transform: scale(0.92);
        }

        /* Плашка подключения кошелька */
        .connect-wallet-panel {
            background: var(--card-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 36px;
            padding: 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            width: 100%;
        }

        .connect-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .wallet-input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 30px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 13px;
            margin-bottom: 14px;
            outline: none;
        }

        .wallet-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .connect-submit {
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            background: var(--accent-color);
            color: white;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .connect-submit:active {
            transform: scale(0.97);
        }

        /* История действий */
        .history-section {
            background: var(--card-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 36px;
            padding: 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            flex: 1;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
        }

        .history-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scrollbar-width: none;
        }

        .history-list::-webkit-scrollbar {
            display: none;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .history-icon {
            width: 36px;
            height: 36px;
            border-radius: 18px;
            background: var(--surface-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        .history-details {
            flex: 1;
        }

        .history-action {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .history-time {
            font-size: 10px;
            color: var(--text-secondary);
        }

        .history-value {
            font-weight: 600;
            color: var(--accent-color);
            font-size: 13px;
        }

        /* Модалка настроек */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-sheet {
            background: var(--card-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 44px;
            padding: 24px 20px;
            width: 90%;
            max-width: 360px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        .modal-sheet h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .modal-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-item:last-child {
            border-bottom: none;
        }

        .modal-btn {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            padding: 6px 16px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 13px;
            min-width: 90px;
            text-align: center;
            transition: 0.2s;
        }

        .modal-btn:active {
            background: var(--accent-color);
            transform: scale(0.95);
        }

        .notif-btn {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            padding: 6px 16px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 13px;
            min-width: 90px;
            text-align: center;
            transition: 0.2s;
        }

        .notif-btn.on {
            background: var(--accent-color);
            color: white;
        }

        .close-modal {
            width: 100%;
            margin-top: 16px;
            padding: 12px;
            border-radius: 40px;
            background: var(--accent-color);
            color: white;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <div class="profile-content">
            <!-- Баланс с кнопкой назад слева -->
            <div class="balance-section">
                <div class="balance-header">
                    <div class="balance-left">
                        <button class="back-btn" id="backBtn">←</button>
                        <div class="balance-info">
                            <div class="balance-label">Баланс</div>
                            <div class="balance-row">
                                <span class="balance-amount" id="balance">125</span>
                                <span class="balance-currency">TON</span>
                            </div>
                        </div>
                    </div>
                    <button class="settings-icon" id="settingsBtn">⚙️</button>
                </div>
                
                <!-- Оценочная стоимость -->
                <div class="estimated-block">
                    <span class="estimated-icon">💰</span>
                    <span class="estimated-text">Оценка имущества</span>
                    <span class="estimated-value" id="estimatedValue">1 250 TON</span>
                </div>

                <div class="action-buttons">
                    <button class="action-btn" id="depositBtn">
                        <span class="action-icon">+</span>
                        <span class="action-text">Пополнить</span>
                    </button>
                    <button class="action-btn" id="withdrawBtn">
                        <span class="action-icon">↑</span>
                        <span class="action-text">Вывести</span>
                    </button>
                </div>
            </div>

            <!-- Профиль пользователя -->
            <div class="user-card">
                <div class="avatar">👤</div>
                <div class="user-info">
                    <div class="user-name" id="userName">CryptoBuilder</div>
                    <div class="wallet-address" id="walletDisplay">Кошелёк не подключён</div>
                </div>
                <button class="edit-btn" id="editProfileBtn">✎</button>
            </div>

            <!-- Плашка подключения кошелька -->
            <div class="connect-wallet-panel" id="connectPanel">
                <div class="connect-title">Подключить TON кошелёк</div>
                <input type="text" class="wallet-input" id="walletInput" placeholder="Введите адрес кошелька">
                <button class="connect-submit" id="connectSubmit">Подключить</button>
            </div>

            <!-- История действий -->
            <div class="history-section">
                <div class="history-title">История действий</div>
                <div class="history-list" id="historyList">
                    <div class="history-item">
                        <div class="history-icon">💰</div>
                        <div class="history-details">
                            <div class="history-action">Пополнение баланса</div>
                            <div class="history-time">2 часа назад</div>
                        </div>
                        <div class="history-value">+50 TON</div>
                    </div>
                    <div class="history-item">
                        <div class="history-icon">🎨</div>
                        <div class="history-details">
                            <div class="history-action">Создан новый куб</div>
                            <div class="history-time">вчера</div>
                        </div>
                        <div class="history-value">#3421</div>
                    </div>
                    <div class="history-item">
                        <div class="history-icon">🏆</div>
                        <div class="history-details">
                            <div class="history-action">Победа в аукционе</div>
                            <div class="history-time">3 дня назад</div>
                        </div>
                        <div class="history-value">+250 TON</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модалка настроек -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-sheet">
            <h2>Настройки</h2>
            
            <div class="modal-item">
                <span>Тема</span>
                <button class="modal-btn" id="themeToggle">
                    <span id="themeText">🌙 Тёмная</span>
                </button>
            </div>
            
            <div class="modal-item">
                <span>Уведомления</span>
                <button class="notif-btn" id="notifToggle">Вкл</button>
            </div>
            
            <div class="modal-item">
                <span>Условия</span>
                <button class="modal-btn" id="termsBtn">Читать</button>
            </div>

            <button class="close-modal" id="closeSettings">Закрыть</button>
        </div>
    </div>

    <script>
        // Назад
        document.getElementById('backBtn').addEventListener('click', () => {
            window.location.href = 'main.html';
        });

        // Настройки
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeSettings = document.getElementById('closeSettings');
        const themeToggle = document.getElementById('themeToggle');
        const themeText = document.getElementById('themeText');
        const notifToggle = document.getElementById('notifToggle');

        settingsBtn.addEventListener('click', () => {
            settingsModal.classList.add('show');
        });

        closeSettings.addEventListener('click', () => {
            settingsModal.classList.remove('show');
        });

        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) {
                settingsModal.classList.remove('show');
            }
        });

        // Тема
        let isDark = true;
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-theme');
            isDark = !isDark;
            themeText.textContent = isDark ? '🌙 Тёмная' : '☀️ Светлая';
        });

        // Уведомления
        let notifOn = true;
        notifToggle.addEventListener('click', () => {
            notifOn = !notifOn;
            notifToggle.textContent = notifOn ? 'Вкл' : 'Выкл';
            notifToggle.classList.toggle('on', notifOn);
        });
        notifToggle.classList.add('on');

        // Условия
        document.getElementById('termsBtn').addEventListener('click', () => {
            alert('📋 Условия использования:\n\n• Создавайте уникальные кубы\n• Участвуйте в аукционах\n• Зарабатывайте TON');
            settingsModal.classList.remove('show');
        });

        // Подключение кошелька
        const connectPanel = document.getElementById('connectPanel');
        const walletInput = document.getElementById('walletInput');
        const connectSubmit = document.getElementById('connectSubmit');
        const walletDisplay = document.getElementById('walletDisplay');

        connectSubmit.addEventListener('click', () => {
            const walletAddress = walletInput.value.trim();
            if (walletAddress) {
                walletDisplay.textContent = walletAddress;
                connectPanel.style.display = 'none';
            } else {
                alert('Введите адрес кошелька');
            }
        });

        // Редактирование имени
        const editBtn = document.getElementById('editProfileBtn');
        const userName = document.getElementById('userName');

        editBtn.addEventListener('click', () => {
            const newName = prompt('Введите новое имя пользователя:', userName.textContent);
            if (newName) {
                userName.textContent = newName;
            }
        });

        // Кнопки действий
        document.getElementById('depositBtn').addEventListener('click', () => {
            alert('💰 Пополнение скоро будет доступно');
        });

        document.getElementById('withdrawBtn').addEventListener('click', () => {
            alert('💸 Вывод средств скоро будет доступен');
        });

        // Имитация баланса
        setInterval(() => {
            const balanceEl = document.getElementById('balance');
            const estEl = document.getElementById('estimatedValue');
            
            if (balanceEl && estEl) {
                const newBalance = (125 + Math.random() * 15).toFixed(1);
                const newEst = (1250 + Math.random() * 200).toFixed(0);
                balanceEl.textContent = newBalance;
                estEl.textContent = newEst + ' TON';
            }
        }, 8000);

        // Добавление новой истории
        setTimeout(() => {
            const historyList = document.getElementById('historyList');
            const newItem = document.createElement('div');
            newItem.className = 'history-item';
            newItem.innerHTML = `
                <div class="history-icon">🎁</div>
                <div class="history-details">
                    <div class="history-action">Ежедневный бонус</div>
                    <div class="history-time">только что</div>
                </div>
                <div class="history-value">+10 TON</div>
            `;
            historyList.prepend(newItem);
        }, 5000);
    </script>
</body>
</html>
