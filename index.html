<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D NFT · вход</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/index.css">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Стили для кнопки */
        .tg-login-wrapper {
            position: relative;
            width: 100%;
            margin: 20px 0;
            height: 60px;
        }

        #telegram-login-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            z-index: 2;
        }

        #telegram-login-container iframe {
            width: 100% !important;
            height: 100% !important;
        }

        .custom-tg-btn {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            z-index: 1;
            box-shadow: 0 8px 20px var(--accent-glow);
            transition: 0.2s;
        }

        .custom-tg-btn:active {
            transform: scale(0.97);
        }

        .custom-tg-btn span {
            font-size: 20px;
        }

        .custom-tg-btn .btn-icon {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="index-container">
        <div class="screen" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <div class="logo-3d">
                <div class="cube">
                    <div class="face front">3</div>
                    <div class="face back"></div>
                    <div class="face right">D</div>
                    <div class="face left"></div>
                    <div class="face top">NFT</div>
                    <div class="face bottom"></div>
                </div>
            </div>

            <div class="login-header">
                <h1>3D NFT</h1>
                <p class="subtitle">Уникальные 3D NFT!</p>
            </div>

            <div class="features">
                <div class="feature">
                    <div class="feature-icon">🎮</div>
                    <div class="feature-text">3D-конструктор</div>
                    <div class="feature-desc">Строй из вокселей</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">💰</div>
                    <div class="feature-text">Зарабатывай</div>
                    <div class="feature-desc">Продавай на аукционе</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">🏆</div>
                    <div class="feature-text">Коллекционируй</div>
                    <div class="feature-desc">Редкие кубы</div>
                </div>
            </div>

            <!-- кнопка входа -->
            <div class="tg-login-wrapper">
                <!-- Контейнер для виджета (прозрачный) -->
                <div id="telegram-login-container"></div>
                
                <!-- Наша кнопка -->
                <button class="custom-tg-btn" id="customLoginBtn">
                    <span class="btn-icon">⚡</span>
                    Войти через Telegram
                </button>
            </div>

            <p class="terms">Продолжая, вы принимаете условия использования</p>
        </div>

        <button class="theme-btn" id="themeToggle">🌙</button>
    </div>

    <script type="module" src="js/index.js"></script>
</body>
</html>
