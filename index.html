<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D NFT · вход</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/themes.css">
</head>
<body>
    <div class="app">
        <div class="screen">
            <!-- Логотип - 3D куб -->
            <div class="logo-3d">
                <div class="cube">
                    <div class="face front">3</div>
                    <div class="face back"></div>
                    <div class="face right">D</div>
                    <div class="face left"></div>
                    <div class="face top">NFT</div>
                    <div class="face bottom"></div>
                </div>
            </div>

            <div class="login-header">
                <h1>3D NFT</h1>
                <p class="subtitle">Создавай. Владей. Продавай.</p>
            </div>

            <div class="features">
                <div class="feature">
                    <div class="feature-icon">🎮</div>
                    <div class="feature-text">3D-конструктор</div>
                    <div class="feature-desc">Строй из вокселей</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">💰</div>
                    <div class="feature-text">Зарабатывай</div>
                    <div class="feature-desc">Продавай на аукционе</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">🏆</div>
                    <div class="feature-text">Коллекционируй</div>
                    <div class="feature-desc">Редкие кубы</div>
                </div>
            </div>

            <button class="connect-btn" id="connectWallet">
                <span class="btn-icon">⚡</span>
                Войти через Telegram
            </button>

            <p class="terms">Продолжая, вы принимаете условия использования</p>
        </div>

        <button class="theme-btn" id="themeToggle">🌙</button>
    </div>

    <script>
        document.getElementById('connectWallet').addEventListener('click', () => {
            window.location.href = 'main.html';
        });

        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-theme');
            themeToggle.textContent = document.body.classList.contains('light-theme') ? '☀️' : '🌙';
        });
    </script>
</body>
</html>
