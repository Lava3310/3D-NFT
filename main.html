<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voxel Universe</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/themes.css">
</head>
<body>
    <div class="ios-container" id="appContainer">
        <!-- Верхняя панель (кликабельная для настроек) -->
        <div class="top-panel" id="topPanel">
            <div class="balance-row">
                <div class="balance-main">
                    <span class="balance-number" id="balance">125</span>
                    <span class="balance-currency">TON</span>
                </div>
                <div class="est-badge">
                    <span class="est-label">💰 Оценка</span>
                    <span class="est-value" id="estimatedValue">~1.8k</span>
                </div>
            </div>

            <!-- Кнопки действий -->
            <div class="action-buttons">
                <button class="action-btn withdraw" id="withdrawBtn">
                    <span class="action-icon">⬆️</span>
                    <span>Вывести</span>
                </button>
                <button class="action-btn deposit" id="depositBtn">
                    <span class="action-icon">+</span>
                    <span>Пополнить</span>
                </button>
            </div>
        </div>

        <!-- Контент -->
        <div class="content-area" id="contentArea">
            <!-- Загружается динамически -->
        </div>

        <!-- Таб-бар -->
        <div class="tab-bar" id="tabBar">
            <div class="tab-item active" data-tab="home">
                <span>🏠</span>
                <span>Главная</span>
            </div>
            <div class="tab-item" data-tab="top">
                <span>🏆</span>
                <span>Топ</span>
            </div>
            <div class="tab-item" data-tab="market">
                <span>🛒</span>
                <span>Маркет</span>
            </div>
            <div class="tab-item" data-tab="auction">
                <span>⚡</span>
                <span>Аукцион</span>
            </div>
            <div class="tab-item" data-tab="events">
                <span>🎉</span>
                <span>События</span>
            </div>
        </div>
    </div>

    <!-- Панель настроек (выезжает сверху как в Telegram) -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-handle"></div>
        <div class="settings-content">
            <h2>Настройки</h2>
            
            <div class="settings-group">
                <div class="settings-item">
                    <span>Тема оформления</span>
                    <button class="theme-toggle" id="themeToggle">
                        <span class="theme-icon">🌙</span>
                        <span class="theme-text">Тёмная</span>
                    </button>
                </div>

                <div class="settings-item">
                    <span>Профиль</span>
                    <button class="settings-nav" id="profileBtn">
                        <span>Открыть</span>
                        <span>→</span>
                    </button>
                </div>

                <div class="settings-item">
                    <span>Язык</span>
                    <button class="settings-nav">
                        <span>Русский</span>
                        <span>→</span>
                    </button>
                </div>
            </div>

            <div class="settings-group">
                <div class="settings-item">
                    <span>Уведомления</span>
                    <label class="switch">
                        <input type="checkbox" checked id="notificationsToggle">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="settings-item">
                    <span>Звуки</span>
                    <label class="switch">
                        <input type="checkbox" checked id="soundsToggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="settings-group">
                <div class="settings-item">
                    <span>Условия использования</span>
                    <button class="settings-nav" id="termsBtn">
                        <span>Читать</span>
                        <span>→</span>
                    </button>
                </div>

                <div class="settings-item">
                    <span>О приложении</span>
                    <button class="settings-nav" id="aboutBtn">
                        <span>Версия 1.0</span>
                        <span>→</span>
                    </button>
                </div>
            </div>

            <div class="settings-footer">
                <button class="ios-button secondary" id="closeSettingsBtn">
                    Закрыть
                </button>
            </div>
        </div>
    </div>

    <script>
        // Состояние
        let isDarkTheme = true;
        let startY = 0;
        let currentY = 0;
        let isDragging = false;

        // Элементы
        const appContainer = document.getElementById('appContainer');
        const settingsPanel = document.getElementById('settingsPanel');
        const topPanel = document.getElementById('topPanel');
        const tabs = document.querySelectorAll('.tab-item');
        const contentArea = document.getElementById('contentArea');

        // ===== НАСТРОЙКИ (свайп вниз / долгий тап) =====

        // Долгий тап на верхней панели
        let pressTimer;
        topPanel.addEventListener('touchstart', (e) => {
            pressTimer = setTimeout(() => {
                openSettings();
            }, 500);
        });

        topPanel.addEventListener('touchend', () => {
            clearTimeout(pressTimer);
        });

        topPanel.addEventListener('touchmove', () => {
            clearTimeout(pressTimer);
        });

        // Свайп вниз по всему экрану
        appContainer.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
            isDragging = true;
        });

        appContainer.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            currentY = e.touches[0].clientY;
            const diff = currentY - startY;

            if (diff > 50 && !settingsPanel.classList.contains('visible')) {
                // Свайп вниз достаточно сильный
                openSettings();
                isDragging = false;
            }
        });

        appContainer.addEventListener('touchend', () => {
            isDragging = false;
        });

        // Открыть настройки
        function openSettings() {
            settingsPanel.classList.add('visible');
            document.body.style.overflow = 'hidden';
        }

        // Закрыть настройки
        function closeSettings() {
            settingsPanel.classList.remove('visible');
            document.body.style.overflow = '';
        }

        // Свайп вверх по панели настроек для закрытия
        settingsPanel.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
            isDragging = true;
        });

        settingsPanel.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            currentY = e.touches[0].clientY;
            const diff = currentY - startY;

            if (diff < -50 && settingsPanel.classList.contains('visible')) {
                closeSettings();
                isDragging = false;
            }
        });

        settingsPanel.addEventListener('touchend', () => {
            isDragging = false;
        });

        // Закрыть по кнопке
        document.getElementById('closeSettingsBtn').addEventListener('click', closeSettings);

        // ===== ТАБЫ =====

        const tabContent = {
            home: `
                <div class="glass-card">
                    <h2 style="font-size: 28px; font-weight: 700; margin-bottom: 8px;">Мои 3D NFT</h2>
                    <p style="color: var(--text-secondary); margin-bottom: 24px;">У вас пока нет кубов</p>
                    <button class="ios-button" onclick="window.location.href='editor.html'">
                        ✨ Создать первый куб
                    </button>
                </div>
                <div class="glass-card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h3 style="font-size: 20px; font-weight: 600;">Доступные воксели</h3>
                        <span style="color: var(--accent-color);">8 шт</span>
                    </div>
                    <div style="display: flex; gap: 16px; overflow-x: auto; padding-bottom: 8px;">
                        <div style="min-width: 80px; text-align: center;">
                            <div style="width: 60px; height: 60px; background: #6080b0; border-radius: 20px; margin: 0 auto;"></div>
                            <span style="font-size: 13px;">Камень</span>
                            <span style="color: var(--text-secondary); font-size: 11px;">5 шт</span>
                        </div>
                        <div style="min-width: 80px; text-align: center;">
                            <div style="width: 60px; height: 60px; background: #8b6b4d; border-radius: 20px; margin: 0 auto;"></div>
                            <span style="font-size: 13px;">Дерево</span>
                            <span style="color: var(--text-secondary); font-size: 11px;">3 шт</span>
                        </div>
                        <div style="min-width: 80px; text-align: center;">
                            <div style="width: 60px; height: 60px; background: #f0c060; border-radius: 20px; margin: 0 auto;"></div>
                            <span style="font-size: 13px;">Золото</span>
                            <span style="color: var(--text-secondary); font-size: 11px;">1 шт</span>
                        </div>
                    </div>
                </div>
            `,
            top: `
                <div class="glass-card">
                    <h3 style="font-size: 22px; font-weight: 600; margin-bottom: 20px;">Топ лидеров</h3>
                    <p style="color: var(--text-secondary);">Рейтинг строителей скоро появится</p>
                </div>
            `,
            market: `
                <div class="glass-card">
                    <h3 style="font-size: 22px; font-weight: 600; margin-bottom: 20px;">Маркет</h3>
                    <p style="color: var(--text-secondary);">Магазин откроется в ближайшее время</p>
                </div>
            `,
            auction: `
                <div class="glass-card">
                    <h3 style="font-size: 22px; font-weight: 600; margin-bottom: 20px;">Аукцион</h3>
                    <p style="color: var(--text-secondary);">Следите за новыми лотами</p>
                </div>
            `,
            events: `
                <div class="glass-card">
                    <h3 style="font-size: 22px; font-weight: 600; margin-bottom: 20px;">События</h3>
                    <p style="color: var(--text-secondary);">Задания и игры скоро появятся</p>
                </div>
            `
        };

        function showTab(tabId) {
            contentArea.innerHTML = tabContent[tabId] || tabContent.home;
            tabs.forEach(t => {
                t.classList.toggle('active', t.dataset.tab === tabId);
            });
        }

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                showTab(tab.dataset.tab);
            });
        });

        showTab('home');

        // ===== ТЕМА =====

        document.getElementById('themeToggle').addEventListener('click', () => {
            document.body.classList.toggle('light-theme');
            isDarkTheme = !isDarkTheme;
            
            const icon = document.querySelector('.theme-icon');
            const text = document.querySelector('.theme-text');
            
            if (isDarkTheme) {
                icon.textContent = '🌙';
                text.textContent = 'Тёмная';
            } else {
                icon.textContent = '☀️';
                text.textContent = 'Светлая';
            }
        });

        // ===== ПРОЧИЕ НАСТРОЙКИ =====

        document.getElementById('profileBtn').addEventListener('click', () => {
            alert('👤 Профиль в разработке');
        });

        document.getElementById('termsBtn').addEventListener('click', () => {
            alert('📋 Условия использования:\n\n• Создавайте уникальные кубы\n• Участвуйте в аукционах\n• Зарабатывайте TON');
        });

        document.getElementById('aboutBtn').addEventListener('click', () => {
            alert('Voxel Universe v1.0\nСоздано с ❤️');
        });

        // ===== КНОПКИ ДЕЙСТВИЙ =====

        document.getElementById('depositBtn').addEventListener('click', () => {
            alert('💰 Пополнение скоро будет доступно');
        });

        document.getElementById('withdrawBtn').addEventListener('click', () => {
            alert('💸 Вывод средств скоро будет доступен');
        });

        // ===== ИМИТАЦИЯ БАЛАНСА =====

        setInterval(() => {
            const balanceEl = document.getElementById('balance');
            const estEl = document.getElementById('estimatedValue');
            
            if (balanceEl && estEl) {
                const newBalance = (125 + Math.random() * 15).toFixed(1);
                const newEst = (1800 + Math.random() * 200).toFixed(0);
                balanceEl.textContent = newBalance;
                estEl.textContent = '~' + newEst;
            }
        }, 8000);
    </script>
</body>
</html>
