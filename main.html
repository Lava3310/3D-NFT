<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D NFT · главная</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg-start: #0a1424;
            --bg-end: #1a2a3a;
            --surface-color: rgba(20, 35, 55, 0.7);
            --card-color: rgba(25, 45, 65, 0.6);
            --text-primary: #ffffff;
            --text-secondary: #a0b8d0;
            --accent-color: #3a7bd5;
            --accent-glow: rgba(58, 123, 213, 0.3);
            --border-color: rgba(80, 140, 255, 0.2);
            --shadow: 0 8px 32px rgba(0, 20, 40, 0.3);
            --blur: blur(20px);
        }

        body.light-theme {
            --bg-start: #e0ecff;
            --bg-end: #d0e0ff;
            --surface-color: rgba(255, 255, 255, 0.7);
            --card-color: rgba(255, 255, 255, 0.6);
            --text-primary: #0a1a2a;
            --text-secondary: #406898;
            --accent-color: #2a7aff;
            --accent-glow: rgba(42, 122, 255, 0.2);
            --border-color: rgba(42, 122, 255, 0.15);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }

        body {
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            background-size: cover;
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 16px;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Верхняя панель */
        .balance-section {
            background: var(--card-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 36px;
            padding: 18px 22px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            width: 100%;
            flex-shrink: 0;
        }

        .balance-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .balance-info {
            flex: 1;
        }

        .balance-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            letter-spacing: 0.3px;
            font-weight: 500;
        }

        .balance-row {
            display: flex;
            align-items: baseline;
        }

        .balance-amount {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -1px;
        }

        .balance-currency {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            margin-left: 6px;
            letter-spacing: -1px;
        }

        .settings-icon {
            width: 48px;
            height: 48px;
            border-radius: 36px;
            background: var(--surface-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 22px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 12px;
        }

        .settings-icon:active {
            transform: rotate(30deg) scale(0.92);
            background: var(--accent-color);
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .action-btn {
            flex: 1;
            background: var(--surface-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 36px;
            padding: 8px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: var(--shadow);
            color: var(--text-primary);
        }

        .action-btn:active {
            transform: scale(0.96);
            background: var(--accent-color);
        }

        .action-icon {
            width: 26px;
            height: 26px;
            border-radius: 26px;
            background: transparent;
            border: 2px solid var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .action-text {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* Контент */
        .content-area {
            flex: 1;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .placeholder-card {
            background: var(--card-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 20px;
            border: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-secondary);
        }

        /* Нижний бар */
        .bottom-nav {
            background: var(--card-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 36px;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            box-shadow: var(--shadow);
            flex-shrink: 0;
            width: 100%;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px 0;
            border-radius: 28px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.2s;
            gap: 4px;
        }

        .nav-item.active {
            color: var(--accent-color);
            background: var(--accent-glow);
        }

        .nav-icon {
            font-size: 18px;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 500;
        }

        /* Модалка */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-sheet {
            background: var(--card-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 24px 20px;
            width: 90%;
            max-width: 360px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        .modal-sheet h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .modal-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-item:last-child {
            border-bottom: none;
        }

        .modal-btn {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 36px;
            padding: 6px 16px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 13px;
            min-width: 90px;
            text-align: center;
            transition: 0.2s;
        }

        .modal-btn:active {
            background: var(--accent-color);
            transform: scale(0.95);
        }

        .notif-btn {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 36px;
            padding: 6px 16px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 13px;
            min-width: 90px;
            text-align: center;
            transition: 0.2s;
        }

        .notif-btn.on {
            background: var(--accent-color);
            color: white;
        }

        .close-modal {
            width: 100%;
            margin-top: 16px;
            padding: 12px;
            border-radius: 36px;
            background: var(--accent-color);
            color: white;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="main-content">
            <!-- Верхняя панель -->
            <div class="balance-section">
                <div class="balance-top">
                    <div class="balance-info">
                        <div class="balance-label">Баланс</div>
                        <div class="balance-row">
                            <span class="balance-amount" id="balance">125</span>
                            <span class="balance-currency">TON</span>
                        </div>
                    </div>
                    <button class="settings-icon" id="settingsBtn">⚙️</button>
                </div>
                
                <div class="action-buttons">
                    <button class="action-btn" id="depositBtn">
                        <span class="action-icon">+</span>
                        <span class="action-text">Пополнить</span>
                    </button>
                    <button class="action-btn" id="withdrawBtn">
                        <span class="action-icon">↑</span>
                        <span class="action-text">Вывести</span>
                    </button>
                </div>
            </div>

            <!-- Контент -->
            <div class="content-area" id="contentArea">
                <div class="placeholder-card" id="homeContent">
                    <h3 style="margin-bottom: 8px;">🏠 Главная</h3>
                    <p>Здесь будут твои 3D NFT</p>
                </div>
                <div class="placeholder-card" id="topContent" style="display: none;">
                    <h3 style="margin-bottom: 8px;">🏆 Топ</h3>
                    <p>Лучшие кубы и коллекционеры</p>
                </div>
                <div class="placeholder-card" id="marketContent" style="display: none;">
                    <h3 style="margin-bottom: 8px;">🛒 Маркет</h3>
                    <p>Покупай и продавай кубы</p>
                </div>
                <div class="placeholder-card" id="auctionContent" style="display: none;">
                    <h3 style="margin-bottom: 8px;">⚡ Аукцион</h3>
                    <p>Торгуйся за редкие экземпляры</p>
                </div>
                <div class="placeholder-card" id="eventsContent" style="display: none;">
                    <h3 style="margin-bottom: 8px;">🎉 События</h3>
                    <p>Ежедневные бонусы и ивенты</p>
                </div>
            </div>

            <!-- Нижний бар -->
            <div class="bottom-nav" id="bottomNav">
                <div class="nav-item active" data-tab="home">
                    <span class="nav-icon">🏠</span>
                    <span class="nav-label">Главная</span>
                </div>
                <div class="nav-item" data-tab="top">
                    <span class="nav-icon">🏆</span>
                    <span class="nav-label">Топ</span>
                </div>
                <div class="nav-item" data-tab="market">
                    <span class="nav-icon">🛒</span>
                    <span class="nav-label">Маркет</span>
                </div>
                <div class="nav-item" data-tab="auction">
                    <span class="nav-icon">⚡</span>
                    <span class="nav-label">Аукцион</span>
                </div>
                <div class="nav-item" data-tab="events">
                    <span class="nav-icon">🎉</span>
                    <span class="nav-label">События</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Модалка -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-sheet">
            <h2>Настройки</h2>
            
            <div class="modal-item">
                <span>Тема</span>
                <button class="modal-btn" id="themeToggle">
                    <span id="themeText">🌙 Тёмная</span>
                </button>
            </div>
            
            <div class="modal-item">
                <span>Профиль</span>
                <button class="modal-btn" id="profileBtn">Открыть</button>
            </div>
            
            <div class="modal-item">
                <span>Уведомления</span>
                <button class="notif-btn" id="notifToggle">Вкл</button>
            </div>
            
            <div class="modal-item">
                <span>Условия</span>
                <button class="modal-btn" id="termsBtn">Читать</button>
            </div>

            <button class="close-modal" id="closeSettings">Закрыть</button>
        </div>
    </div>

    <script>
        // Переключение вкладок
        const navItems = document.querySelectorAll('.nav-item');
        const contents = {
            home: document.getElementById('homeContent'),
            top: document.getElementById('topContent'),
            market: document.getElementById('marketContent'),
            auction: document.getElementById('auctionContent'),
            events: document.getElementById('eventsContent')
        };

        navItems.forEach(item => {
            item.addEventListener('click', () => {
                navItems.forEach(n => n.classList.remove('active'));
                item.classList.add('active');

                Object.values(contents).forEach(c => c.style.display = 'none');

                const tab = item.dataset.tab;
                if (contents[tab]) {
                    contents[tab].style.display = 'block';
                }
            });
        });

        // Настройки
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeSettings = document.getElementById('closeSettings');
        const themeToggle = document.getElementById('themeToggle');
        const themeText = document.getElementById('themeText');
        const notifToggle = document.getElementById('notifToggle');

        settingsBtn.addEventListener('click', () => {
            settingsModal.classList.add('show');
        });

        closeSettings.addEventListener('click', () => {
            settingsModal.classList.remove('show');
        });

        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) {
                settingsModal.classList.remove('show');
            }
        });

        // Тема
        let isDark = true;
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-theme');
            isDark = !isDark;
            themeText.textContent = isDark ? '🌙 Тёмная' : '☀️ Светлая';
        });

        // Уведомления
        let notifOn = true;
        notifToggle.addEventListener('click', () => {
            notifOn = !notifOn;
            notifToggle.textContent = notifOn ? 'Вкл' : 'Выкл';
            notifToggle.classList.toggle('on', notifOn);
        });
        notifToggle.classList.add('on');

        // Профиль
        document.getElementById('profileBtn').addEventListener('click', () => {
            alert('👤 Профиль в разработке');
            settingsModal.classList.remove('show');
        });

        // Условия
        document.getElementById('termsBtn').addEventListener('click', () => {
            alert('📋 Условия использования:\n\n• Создавайте уникальные кубы\n• Участвуйте в аукционах\n• Зарабатывайте TON');
            settingsModal.classList.remove('show');
        });

        // Кнопки действий
        document.getElementById('depositBtn').addEventListener('click', () => {
            alert('💰 Пополнение скоро будет доступно');
        });

        document.getElementById('withdrawBtn').addEventListener('click', () => {
            alert('💸 Вывод средств скоро будет доступен');
        });

        // Имитация баланса
        setInterval(() => {
            const balanceEl = document.getElementById('balance');
            if (balanceEl) {
                const newBalance = (125 + Math.random() * 15).toFixed(1);
                balanceEl.textContent = newBalance;
            }
        }, 8000);
    </script>
</body>
</html>
