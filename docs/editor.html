<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voxel Universe · редактор</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg-color: #0a0a14;
            --surface-color: rgba(20, 20, 30, 0.8);
            --text-primary: #ffffff;
            --text-secondary: #8e8e95;
            --accent-color: #ff8844;
            --border-color: rgba(255, 255, 255, 0.1);
            --blur: blur(20px);
        }

        body {
            background: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px;
            pointer-events: none;
        }

        /* Верхняя панель */
        .top-panel {
            background: var(--surface-color);
            backdrop-filter: var(--blur);
            border-radius: 40px;
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
            width: fit-content;
            margin-left: auto;
            gap: 12px;
        }

        .cube-stats {
            display: flex;
            gap: 12px;
            font-size: 12px;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
        }

        .stat-value {
            color: var(--text-primary);
        }

        .close-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: var(--text-primary);
            width: 28px;
            height: 28px;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
        }

        /* Нижняя панель инструментов */
        .bottom-tools {
            display: flex;
            gap: 6px;
            justify-content: center;
            pointer-events: none;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .tool-item {
            background: var(--surface-color);
            backdrop-filter: var(--blur);
            border-radius: 40px;
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .tool-item:active {
            background: var(--accent-color);
        }

        /* Быстрый доступ (выбранный блок) */
        .quick-access {
            background: var(--surface-color);
            backdrop-filter: var(--blur);
            border-radius: 40px;
            padding: 4px 12px;
            border: 1px solid var(--border-color);
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .current-block {
            width: 36px;
            height: 36px;
            border-radius: 18px;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        /* Инвентарь (скрыт по умолчанию) */
        .inventory-panel {
            background: var(--surface-color);
            backdrop-filter: var(--blur);
            border-radius: 30px;
            padding: 16px;
            border: 1px solid var(--border-color);
            pointer-events: auto;
            margin-bottom: 8px;
            max-height: 40vh;
            overflow-y: auto;
            display: none;
        }

        .inventory-panel.show {
            display: block;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .inv-item {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 12px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .inv-item.selected {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        .inv-icon {
            font-size: 24px;
        }

        .inv-name {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .inv-count {
            font-size: 10px;
            background: rgba(0,0,0,0.3);
            padding: 2px 8px;
            border-radius: 20px;
        }

        /* Панель перемещения */
        .move-panel {
            background: var(--surface-color);
            backdrop-filter: var(--blur);
            border-radius: 40px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            pointer-events: auto;
            display: flex;
            gap: 4px;
        }

        .move-btn {
            width: 36px;
            height: 36px;
            border-radius: 18px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
        }

        .move-btn:active {
            background: var(--accent-color);
        }

        /* Панель действий */
        .actions-panel {
            background: var(--surface-color);
            backdrop-filter: var(--blur);
            border-radius: 40px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            pointer-events: auto;
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .action-btn.save {
            background: var(--accent-color);
            color: black;
        }

        .selected-info {
            background: rgba(0,0,0,0.3);
            border-radius: 30px;
            padding: 4px 12px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="ui">
        <!-- Верхняя панель -->
        <div class="top-panel">
            <div class="cube-stats">
                <div class="stat"><span>📏</span><span class="stat-value" id="cube-size">8</span></div>
                <div class="stat"><span>🧩</span><span class="stat-value" id="voxel-count">0/512</span></div>
                <div class="stat"><span>⭐</span><span class="stat-value" id="cube-rarity">об</span></div>
            </div>
            <button class="close-btn" onclick="window.location.href='index.html'">✕</button>
        </div>

        <!-- Инвентарь (скрыт) -->
        <div class="inventory-panel" id="inventory">
            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                <span>Мои блоки</span>
                <button class="action-btn" id="closeInventory">✕</button>
            </div>
            <div class="inventory-grid" id="inventoryGrid">
                <!-- будут добавлены скриптом -->
            </div>
        </div>

        <!-- Нижняя часть -->
        <div style="display: flex; flex-direction: column; gap: 8px;">
            <!-- Кнопки инструментов -->
            <div class="bottom-tools">
                <div class="tool-item" id="openInventory">
                    <span>📦</span> Блоки
                </div>
                <div class="tool-item" id="loadModel">
                    <span>📤</span> Загрузить 3D
                </div>
                <input type="file" id="modelInput" accept=".obj,.gltf,.glb,.vox" style="display: none;">
            </div>

            <!-- Быстрый доступ + перемещение + действия -->
            <div style="display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;">
                <!-- Быстрый доступ -->
                <div class="quick-access">
                    <span>Текущий:</span>
                    <div class="current-block" id="currentBlock">🪨</div>
                </div>

                <!-- Перемещение -->
                <div class="move-panel">
                    <button class="move-btn" data-dir="up">⬆️</button>
                    <button class="move-btn" data-dir="down">⬇️</button>
                    <button class="move-btn" data-dir="left">⬅️</button>
                    <button class="move-btn" data-dir="right">➡️</button>
                    <button class="move-btn" data-dir="forward">↗️</button>
                    <button class="move-btn" data-dir="backward">↙️</button>
                </div>

                <!-- Действия -->
                <div class="actions-panel">
                    <span class="selected-info" id="selectedInfo">🔹 нет</span>
                    <button class="action-btn" id="deleteBtn">🗑️</button>
                    <button class="action-btn save" id="saveBtn">💾</button>
                    <button class="action-btn" id="clearBtn">✨</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Подключаем Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'https://unpkg.com/three@0.128.0/examples/jsm/controls/OrbitControls.js';

        // Конфиг
        const SIZE = 8;
        const TOTAL_VOXELS = SIZE * SIZE * SIZE;
        
        // Состояние
        let voxels = [];
        let selectedIndex = -1;
        let currentType = 'stone';
        
        // Инвентарь (тип: количество)
        const inventory = {
            stone: 5,
            wood: 3,
            gold: 1,
            diamond: 0,
            glass: 2,
            obsidian: 1,
            glowstone: 3
        };

        // Все доступные типы
        const blockTypes = [
            { id: 'stone', name: 'Камень', icon: '🪨', color: 0x808080 },
            { id: 'wood', name: 'Дерево', icon: '🪵', color: 0x8B4513 },
            { id: 'gold', name: 'Золото', icon: '✨', color: 0xFFD700 },
            { id: 'diamond', name: 'Алмаз', icon: '💎', color: 0x00FFFF },
            { id: 'glass', name: 'Стекло', icon: '🔮', color: 0x88CCFF },
            { id: 'obsidian', name: 'Обсидиан', icon: '🪨', color: 0x330033 },
            { id: 'glowstone', name: 'Светокамень', icon: '💡', color: 0xFFAA00 }
        ];

        // Цвета для Three.js
        const colors = {};
        blockTypes.forEach(t => colors[t.id] = t.color);

        // Сцена
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a14);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(7, 5, 9);
        camera.lookAt(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.maxPolarAngle = Math.PI / 2;
        controls.target.set(0, 2, 0);

        // Свет
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const light1 = new THREE.DirectionalLight(0xffeedd, 1.5);
        light1.position.set(5, 10, 7);
        light1.castShadow = true;
        scene.add(light1);
        const light2 = new THREE.PointLight(0x3366aa, 0.5);
        light2.position.set(-3, 5, -5);
        scene.add(light2);

        // Пол
        const floor = new THREE.Mesh(
            new THREE.CircleGeometry(12, 32),
            new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.4, metalness: 0.1 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -1.5;
        floor.receiveShadow = true;
        scene.add(floor);

        // Сетка
        const gridHelper = new THREE.GridHelper(SIZE * 1.0, SIZE, 0x445588, 0x223344);
        gridHelper.position.set(0, -1.5, 0);
        scene.add(gridHelper);

        // Контур
        const edges = new THREE.EdgesGeometry(new THREE.BoxGeometry(SIZE, SIZE, SIZE));
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x445588, opacity: 0.3, transparent: true }));
        line.position.set(0, SIZE/2 - 1.5, 0);
        scene.add(line);

        // Группа вокселей
        const voxelGroup = new THREE.Group();
        scene.add(voxelGroup);

        // ===== ФУНКЦИИ =====

        function createVoxelMesh(x, y, z, type, isSelected = false) {
            const geo = new THREE.BoxGeometry(1, 1, 1);
            const mat = new THREE.MeshStandardMaterial({
                color: colors[type] || 0x808080,
                emissive: isSelected ? 0x331100 : 0x000000,
                roughness: 0.3,
                metalness: type === 'gold' || type === 'diamond' ? 0.5 : 0.1
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x - SIZE/2 + 0.5, y - SIZE/2 + 0.5, z - SIZE/2 + 0.5);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = { x, y, z, type };
            return mesh;
        }

        function renderVoxels() {
            while(voxelGroup.children.length) voxelGroup.remove(voxelGroup.children[0]);
            voxels.forEach((voxel, i) => {
                voxelGroup.add(createVoxelMesh(voxel.x, voxel.y, voxel.z, voxel.type, i === selectedIndex));
            });
            updateUI();
        }

        function updateUI() {
            document.getElementById('voxel-count').textContent = `${voxels.length}/${TOTAL_VOXELS}`;
            let rarity = 'об';
            const percent = voxels.length / TOTAL_VOXELS;
            if (percent > 0.7) rarity = 'ред';
            if (percent > 0.9) rarity = 'лег';
            document.getElementById('cube-rarity').textContent = rarity;
            
            if (selectedIndex >= 0 && selectedIndex < voxels.length) {
                const v = voxels[selectedIndex];
                document.getElementById('selectedInfo').innerHTML = `🔹 ${v.type} (${v.x},${v.y},${v.z})`;
            } else {
                document.getElementById('selectedInfo').innerHTML = '🔹 нет';
            }

            // Обновить текущий блок в быстром доступе
            const block = blockTypes.find(b => b.id === currentType);
            document.getElementById('currentBlock').innerHTML = block ? block.icon : '🪨';
        }

        function isFree(x, y, z) {
            return !voxels.some(v => v.x === x && v.y === y && v.z === z);
        }

        function addVoxel(x, y, z, type) {
            if (x < 0 || x >= SIZE || y < 0 || y >= SIZE || z < 0 || z >= SIZE) return false;
            if (!isFree(x, y, z)) return false;
            if (inventory[type] <= 0) {
                alert(`У вас нет блока ${type}`);
                return false;
            }
            inventory[type]--;
            voxels.push({ x, y, z, type });
            renderVoxels();
            updateInventoryDisplay();
            return true;
        }

        function removeVoxel(index) {
            if (index < 0 || index >= voxels.length) return;
            const type = voxels[index].type;
            inventory[type] = (inventory[type] || 0) + 1;
            voxels.splice(index, 1);
            if (selectedIndex === index) selectedIndex = -1;
            else if (selectedIndex > index) selectedIndex--;
            renderVoxels();
            updateInventoryDisplay();
        }

        function moveVoxel(index, dx, dy, dz) {
            if (index < 0 || index >= voxels.length) return false;
            const v = voxels[index];
            const nx = v.x + dx, ny = v.y + dy, nz = v.z + dz;
            if (nx < 0 || nx >= SIZE || ny < 0 || ny >= SIZE || nz < 0 || nz >= SIZE) return false;
            if (!isFree(nx, ny, nz)) return false;
            v.x = nx; v.y = ny; v.z = nz;
            renderVoxels();
            return true;
        }

        // Обновить отображение инвентаря
        function updateInventoryDisplay() {
            const grid = document.getElementById('inventoryGrid');
            grid.innerHTML = '';
            
            blockTypes.forEach(block => {
                const count = inventory[block.id] || 0;
                const item = document.createElement('div');
                item.className = `inv-item ${block.id === currentType ? 'selected' : ''}`;
                item.dataset.type = block.id;
                item.innerHTML = `
                    <div class="inv-icon">${block.icon}</div>
                    <div class="inv-name">${block.name}</div>
                    <div class="inv-count">${count}</div>
                `;
                item.addEventListener('click', () => {
                    document.querySelectorAll('.inv-item').forEach(el => el.classList.remove('selected'));
                    item.classList.add('selected');
                    currentType = block.id;
                    
                    // Обновить быстрый доступ
                    document.getElementById('currentBlock').innerHTML = block.icon;
                    
                    // Закрыть инвентарь
                    document.getElementById('inventory').classList.remove('show');
                });
                grid.appendChild(item);
            });
        }

        // Тестовые данные
        addVoxel(2, 2, 2, 'stone');
        addVoxel(3, 2, 2, 'stone');
        addVoxel(4, 2, 2, 'stone');
        addVoxel(3, 3, 2, 'wood');
        addVoxel(3, 2, 3, 'gold');

        // ===== ОБРАБОТЧИКИ =====

        // Открыть инвентарь
        document.getElementById('openInventory').addEventListener('click', () => {
            updateInventoryDisplay();
            document.getElementById('inventory').classList.add('show');
        });

        // Закрыть инвентарь
        document.getElementById('closeInventory').addEventListener('click', () => {
            document.getElementById('inventory').classList.remove('show');
        });

        // Загрузить модель
        document.getElementById('loadModel').addEventListener('click', () => {
            document.getElementById('modelInput').click();
        });

        document.getElementById('modelInput').addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                alert(`Загружен файл: ${e.target.files[0].name}. Конвертация в воксели будет позже.`);
            }
        });

        // Raycaster
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        renderer.domElement.addEventListener('click', (e) => {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(voxelGroup.children);
            
            if (intersects.length > 0) {
                const mesh = intersects[0].object;
                const index = voxels.findIndex(v => 
                    v.x === mesh.userData.x && v.y === mesh.userData.y && v.z === mesh.userData.z
                );
                if (index !== -1) {
                    if (e.shiftKey) {
                        removeVoxel(index);
                    } else {
                        selectedIndex = index;
                        renderVoxels();
                    }
                }
            } else {
                // Добавление по клику (можно потом сделать)
                console.log('клик в пустоту');
            }
        });

        // Кнопки перемещения
        document.querySelectorAll('.move-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (selectedIndex === -1) return;
                const dir = btn.dataset.dir;
                const moves = {
                    up: [0,1,0], down: [0,-1,0],
                    left: [-1,0,0], right: [1,0,0],
                    forward: [0,0,1], backward: [0,0,-1]
                };
                const [dx, dy, dz] = moves[dir];
                moveVoxel(selectedIndex, dx, dy, dz);
            });
        });

        // Кнопки действий
        document.getElementById('deleteBtn').addEventListener('click', () => {
            if (selectedIndex !== -1) removeVoxel(selectedIndex);
        });

        document.getElementById('saveBtn').addEventListener('click', () => {
            localStorage.setItem('savedCube', JSON.stringify({
                size: SIZE,
                voxels,
                date: new Date().toISOString()
            }));
            alert('Куб сохранён');
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            if (confirm('Очистить всё?')) {
                // Вернуть все воксели в инвентарь
                voxels.forEach(v => {
                    inventory[v.type] = (inventory[v.type] || 0) + 1;
                });
                voxels = [];
                selectedIndex = -1;
                renderVoxels();
                updateInventoryDisplay();
            }
        });

        // Анимация
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
