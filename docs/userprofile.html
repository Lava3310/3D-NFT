<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D NFT · профиль</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/profile.css">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- TON Connect -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
</head>
<body>
    <div class="profile-container">
        <div class="profile-content">
            <!-- Баланс -->
            <div class="balance-section">
                <div class="balance-top">
                    <div class="balance-left">
                        <button class="back-btn" id="backBtn">←</button>
                        <div class="balance-info">
                            <div class="balance-label">Баланс</div>
                            <div class="balance-row">
                                <span class="balance-amount" id="balance">125</span>
                                <span class="balance-currency">TON</span>
                            </div>
                        </div>
                    </div>
                    <button class="settings-icon" id="settingsBtn">⚙️</button>
                </div>
                
                <div class="estimated-block">
                    <span class="estimated-icon">💰</span>
                    <span class="estimated-text">Оценка имущества</span>
                    <span class="estimated-value" id="estimatedValue">1 250 TON</span>
                </div>

                <div class="action-buttons">
                    <button class="action-btn" id="depositBtn">
                        <span class="action-icon">+</span>
                        <span class="action-text">Пополнить</span>
                    </button>
                    <button class="action-btn" id="withdrawBtn">
                        <span class="action-icon">↑</span>
                        <span class="action-text">Вывести</span>
                    </button>
                </div>
            </div>

            <!-- Профиль пользователя -->
            <div class="user-card">
                <div class="avatar-section">
                    <div class="avatar-container">
                        <img src="" alt="avatar" id="userAvatar" class="avatar-img" style="display: none;">
                        <div class="avatar-placeholder" id="avatarPlaceholder">👤</div>
                        
                        <!-- Кнопка изменения аватара -->
                        <button class="avatar-edit-btn" id="editAvatarBtn" style="display: none;">
                            <span class="avatar-edit-icon">📷</span>
                        </button>
                    </div>
                    
                    <!-- Скрытый input для загрузки файла -->
                    <input type="file" id="avatarUpload" accept="image/*" style="display: none;">
                </div>
                
                <div class="user-info">
                    <div class="user-name" id="userName">Загрузка...</div>
                    <input type="text" id="editNameInput" class="edit-input" placeholder="Новое имя" style="display: none;">
                    
                    <div class="wallet-address" id="walletDisplay">Кошелёк не подключён</div>
                    
                    <!-- Кнопка TON Connect (будет заменена через JS) -->
                    <div id="ton-connect-button"></div>
                    
                    <div class="register-date" id="registerDate"></div>
                </div>
                
                <div class="edit-actions" id="editActions" style="display: none;">
                    <button class="edit-action-btn save-btn" id="saveEditBtn">💾</button>
                    <button class="edit-action-btn cancel-btn" id="cancelEditBtn">✕</button>
                </div>
                
                <button class="edit-btn" id="editProfileBtn">✎</button>
            </div>

            <!-- Плашка подключения кошелька (старая) - СКРЫВАЕМ -->
            <div class="connect-wallet-panel" id="connectPanel" style="display: none;">
                <div class="connect-title">Подключить TON кошелёк</div>
                <input type="text" class="wallet-input" id="walletInput" placeholder="Введите адрес кошелька" style="display: none;">
                <button class="connect-submit" id="connectSubmit" style="display: none;">Подключить</button>
            </div>

            <!-- История действий -->
            <div class="history-section">
                <div class="history-title">История действий</div>
                <div class="history-list" id="historyList">
                    <div class="history-item">
                        <div class="history-icon">💰</div>
                        <div class="history-details">
                            <div class="history-action">Пополнение баланса</div>
                            <div class="history-time">2 часа назад</div>
                        </div>
                        <div class="history-value">+50 TON</div>
                    </div>
                    <div class="history-item">
                        <div class="history-icon">🎨</div>
                        <div class="history-details">
                            <div class="history-action">Создан новый куб</div>
                            <div class="history-time">вчера</div>
                        </div>
                        <div class="history-value">#3421</div>
                    </div>
                    <div class="history-item">
                        <div class="history-icon">🏆</div>
                        <div class="history-details">
                            <div class="history-action">Победа в аукционе</div>
                            <div class="history-time">3 дня назад</div>
                        </div>
                        <div class="history-value">+250 TON</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модалка настроек -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-sheet">
            <h2>Настройки</h2>
            
            <div class="modal-item">
                <span>Тема</span>
                <button class="modal-btn" id="themeToggle">
                    <span id="themeText">🌙 Тёмная</span>
                </button>
            </div>
            
            <div class="modal-item">
                <span>Уведомления</span>
                <button class="notif-btn" id="notifToggle">Вкл</button>
            </div>
            
            <div class="modal-item">
                <span>Условия</span>
                <button class="modal-btn" id="termsBtn">Читать</button>
            </div>

            <button class="close-modal" id="closeSettings">Закрыть</button>
        </div>
    </div>

    <script type="module" src="js/profile.js"></script>
</body>
</html>
